
services:
  jekyll-site:
    image: jekyll-site
    build: .
    restart: unless-stopped
    user: "0:0"
    volumes:
      - .:/usr/src/app
      - jekyll-bundle:/bundle
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      JEKYLL_ENV: docker
      BUNDLE_PATH: /bundle
    command: sh -c "bundle check >/dev/null 2>&1 || bundle install --quiet; bundle exec jekyll serve -H 0.0.0.0 -w --config _config.yml,_config_docker.yml"

volumes:
  jekyll-bundle:
    external: true
