  # ── the three drawn figures: the hero network, the perceptron, the map ─────
  #  Their captions and glosses are essay copy, but they carry no links and no
  #  markup beyond an entity or two, so unlike the page prose they can live
  #  here and the SVGs stay single-sourced.
  in_vision: "vision"
  in_language: "language"
  in_speech: "speech"
  mlp_nav: "Sections of this page"
  mlp_title: "This page, drawn as a 3&#8211;5&#8211;5&#8211;7 multilayer perceptron: vision, language and speech feed forward to seven output units, and every output unit is a section below. One unit is active at a time &#8212; the section in view."
  mlp_cap: "A 3&#8211;5&#8211;5&#8211;7 network: vision, language and speech in; the sections of this page out. One output unit fires at a time &#8212; the section you are reading &#8212; and the path that feeds it is drawn back through the hidden layers. Follow an output unit and the page goes there."
  pc_h2: "One unit, three inputs"
  pc_alt: "A single artificial neuron. Three inputs — vision, language and speech — are weighted, summed together with a bias, passed through an activation function, and produce one output."
  pc_output: "output"
  pc_eqn_alt: "y equals phi of the weighted sum plus b"
  pc_attrib: "[one artificial neuron, Rosenblatt 1958, The Perceptron]"
  pc_gloss: "The three inputs are the three things I actually work on. The weights are where the hours went — speech has been carrying the largest one for two years now. The bias is everything else: the teaching, the talks, and the reading that never reaches a repository. The activation is what any of it is worth to somebody who is not me."
  at_h2: "What the work attends to"
  at_terms:
    - vision
    - speech
    - language
    - low-resource
    - "Moor&eacute;"
    - ASR
    - VLM
    - data
  at_alt: "An eight by eight affinity map over the keywords vision, speech, language, low-resource, Mooré, ASR, VLM and data. The diagonal is darkest. Off the diagonal the strongest cells are speech with Mooré, speech with ASR, speech with low-resource, low-resource with Mooré, and vision with VLM. Vision has no affinity at all with Mooré or ASR."
  at_weak: "Weak"
  at_strong: "Strong"
  at_eqn_alt: "Attention of Q, K and V equals softmax of Q K transpose divided by the square root of d sub k, times V"
  at_attrib: "[attention, Vaswani et al. 2017, Attention Is All You Need]"
  at_gloss: "Eight words carry almost everything I have worked on. The grid is what each one attends to in the others: speech pulls hardest on Moor&eacute;, ASR and the whole low-resource problem; vision pulls almost entirely on VLM; language is the one term that touches every other. It is read symmetrically, which a real attention map never is &mdash; this is a portrait of which ideas keep turning up together, not a matrix lifted out of a trained model."

