  in_vision: "vision"
  in_language: "langage"
  in_speech: "parole"
  in_curiosity: "Curiosité scientifique"
  in_deep_work: "Travail en profondeur"
  in_critical: "Esprit critique"
  mlp_nav: "Sections de cette page"
  mlp_mark: "Sections de la page d&rsquo;accueil"
  mlp_title: "Cette page, dessinée comme un perceptron multicouche 3&#8211;5&#8211;5&#8211;7 : la curiosité scientifique, le travail en profondeur et l&rsquo;esprit critique en entrée, sept unités de sortie, et chaque unité de sortie est une section ci-dessous. L&rsquo;unité active est la section à l&rsquo;écran."
  mlp_cap: "Une formule simple mais puissante que j&rsquo;adore. Chaque f est une couche, et la longueur de la chaîne donne la profondeur, d&rsquo;où le nom d&rsquo;apprentissage profond. Une seule couche cachée peut approcher n&rsquo;importe quelle fonction continue, mais elle risque d&rsquo;être démesurément grande, et un modèle plus profond peut souvent se contenter de moins d&rsquo;unités. Les trois entrées sont ce qui façonne ma personnalité et mon profil."
  mlp_cap_follow: "Les sorties sont les sections de cette page&#8239;: suivez-en une et la page vous y emmène."
  mlp_cap_list: "Les sorties sont les sections de cette page, listées ci-dessous."
  mlp_eq_alt: "f de x égale f trois de f deux de f un de x"
  mlp_attrib: "[réseaux profonds à propagation avant, Goodfellow et al. 2016, Deep Learning]"
  pc_alt: "Un seul neurone artificiel. Trois entrées (vision, langage et parole) sont pondérées, sommées avec un biais, passées dans une fonction d&rsquo;activation, et produisent une sortie."
  pc_output: "sortie"
  pc_eqn_alt: "y égale phi de la somme pondérée plus b"
  pc_attrib: "[un neurone artificiel, Rosenblatt 1958, The Perceptron]"
  pc_gloss: "Un neurone artificiel&#8239;: il multiplie chaque entrée par un poids, ajoute un biais b et fait passer la somme dans une activation φ pour produire sa sortie. Seul, il ne peut séparer ses entrées que par une frontière linéaire, et ne peut donc pas apprendre le XOR, la limite que Minsky et Papert ont rendue célèbre en 1969. Empilés en couches, ces neurones dépassent cette limite, et ils sont la brique de base des réseaux profonds derrière beaucoup des projets ci-dessous. Ici, les trois entrées sont les domaines dans lesquels je travaille le plus&#8239;: la vision, le langage et la parole."
  at_terms:
    - "Machine Learning"
    - "Deep Learning"
    - "Computer Vision"
    - "NLP"
    - "Speech Processing"
    - "Data Science"
    - "Data Engineering"
    - "MLOps"
  at_alt: "Une carte d&rsquo;affinité de huit sur huit entre Machine Learning, Deep Learning, Computer Vision, NLP, Speech Processing, Data Science, Data Engineering et MLOps. La diagonale est la plus sombre. Hors diagonale, les cases les plus fortes relient Deep Learning à Computer Vision, NLP et Speech Processing, Speech Processing à NLP, et Machine Learning à Deep Learning et Data Science. Data Engineering est le plus proche de Data Science et de MLOps. Les paires les plus faibles sont Computer Vision avec Speech Processing et avec Data Engineering, et Speech Processing avec Data Science."
  at_weak: "Faible"
  at_strong: "Fort"
  at_eqn_alt: "Attention de Q, K et V égale softmax de Q K transposée divisé par la racine carrée de d indice k, le tout multiplié par V"
  at_attrib: "[attention, Vaswani et al. 2017, Attention Is All You Need]"
  at_gloss: "Huit termes qui couvrent l&rsquo;essentiel de mon travail. Chaque case montre à quel point deux d&rsquo;entre eux sont liés dans mes projets. Le Deep Learning est au centre, relié à Computer Vision, NLP et Speech Processing, et ces deux derniers sont étroitement liés par mon travail sur le moor&eacute;. Data Engineering reste proche de Data Science et de MLOps. La grille est symétrique, ce qu&rsquo;une vraie carte d&rsquo;attention n&rsquo;est presque jamais&#8239;: lisez-la comme un portrait des idées qui vont ensemble, pas comme les poids d&rsquo;un modèle entraîné."

