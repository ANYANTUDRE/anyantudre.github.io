# ─────────────────────────────────────────────────────────────────────────────
#  t.yml — THE UI STRING CATALOGUE.  ROUND 6, § 1.
#
#  GitHub Pages builds this site with its own Jekyll and ignores _plugins/, so
#  there is no i18n plugin and there never will be one. The French site is
#  therefore plain pages plus this file: every string a layout or an include
#  EMITS ITSELF lives here under `en:` and `fr:`, and the templates read
#
#      {%- assign lang = page.lang | default: 'en' -%}
#      {%- assign t = site.data.t[lang] -%}
#
#  and then `{{ t.something }}`. A bare English literal in a template is a bug:
#  it would show up untranslated in the middle of a French page.
#
#  WHAT DOES NOT LIVE HERE: his prose. Paragraphs carry inline links and markup,
#  and Liquid does not re-render the contents of a variable, so `{{ t.para }}`
#  could never produce a working <a href="{{ … | relative_url }}">. Prose is
#  branched with {% if page.lang == 'fr' %} inside the include that holds it,
#  where the two versions sit next to each other and are edited together.
#  Collection content — titles and excerpts — lives in each item's own front
#  matter as `title_fr:` / `excerpt_fr:`, one file per entry, never two.
#
#  DATES. Jekyll's `date:` filter cannot localise, so `months` / `months_abbr`
#  are indexed by hand. Use _includes/redesign/date.html, never a bare
#  `date: '%-d %B %Y'`, anywhere a French page can reach.
#
#  PLACEHOLDERS. A few strings carry %s / %1 / %2, filled with `replace`:
#      {{ t.all_projects | replace: '%s', count }}
#  so the number can sit in a different place in each language.
#
#  The two blocks must stay key-for-key identical. A key present in `en:` and
#  missing from `fr:` prints nothing at all on the French page.
# ─────────────────────────────────────────────────────────────────────────────

