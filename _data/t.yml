  mlp_nav: "Sections of this page"
  mlp_mark: "Sections of the home page"
  mlp_title: "This page, drawn as a 3&#8211;5&#8211;5&#8211;7 multilayer perceptron: scientific curiosity, deep work and critical thinking feed forward to seven output units, and every output unit is a section below. The unit that is active is the section in view."
  mlp_cap: "A simple yet powerful formula I love. Each f is a layer, and the length of the chain gives the depth, which is where the name deep learning comes from. One hidden layer can approximate any continuous function, but it may need to be infeasibly large, and a deeper model can often make do with fewer units. The three inputs are what shape my personality and my profile."
  mlp_cap_follow: "The outputs are the sections of this page: follow one and the page goes there."
  mlp_cap_list: "The outputs are the sections of this page, listed below."
  mlp_eq_alt: "f of x equals f three of f two of f one of x"
  mlp_attrib: "[deep feedforward networks, Goodfellow et al. 2016, Deep Learning]"
  pc_alt: "A single artificial neuron. Three inputs (vision, language and speech) are weighted, summed together with a bias, passed through an activation function, and produce one output."
  pc_output: "output"
  pc_eqn_alt: "y equals phi of the weighted sum plus b"
  pc_attrib: "[one artificial neuron, Rosenblatt 1958, The Perceptron]"
  pc_gloss: "One artificial neuron: it multiplies each input by a weight, adds a bias b, and passes the sum through an activation φ to produce its output. On its own it can only split its inputs with a linear boundary, so it cannot learn XOR, the limit Minsky and Papert made famous in 1969. Stacked in layers, units like this one overcome that limit, and they are the building block of the deep networks behind many of the projects below. Here the three inputs are the fields I work in most: vision, language and speech."
  at_terms:
    - "Machine Learning"
    - "Deep Learning"
    - "Computer Vision"
    - "NLP"
    - "Speech Processing"
    - "Data Science"
    - "Data Engineering"
    - "MLOps"
  at_alt: "An eight by eight affinity map over Machine Learning, Deep Learning, Computer Vision, NLP, Speech Processing, Data Science, Data Engineering and MLOps. The diagonal is darkest. Off the diagonal the strongest cells link Deep Learning with Computer Vision, NLP and Speech Processing, Speech Processing with NLP, and Machine Learning with Deep Learning and Data Science. Data Engineering is closest to Data Science and MLOps. The weakest pairs are Computer Vision with Speech Processing and with Data Engineering, and Speech Processing with Data Science."
  at_weak: "Weak"
  at_strong: "Strong"
  at_eqn_alt: "Attention of Q, K and V equals softmax of Q K transpose divided by the square root of d sub k, times V"
  at_attrib: "[attention, Vaswani et al. 2017, Attention Is All You Need]"
  at_gloss: "Eight terms that cover most of what I work on. Each cell shows how closely two of them are linked in my projects. Deep learning sits in the middle, tied to computer vision, NLP and speech processing, and the last two are tightly linked through my work on Moor&eacute;. Data engineering stays close to data science and MLOps. The grid is symmetric, which a real attention map almost never is, so read it as a picture of which ideas go together, not as weights from a trained model."

