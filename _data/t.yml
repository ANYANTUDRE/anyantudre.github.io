  # ── les trois figures dessinées ───────────────────────────────────────────
  in_vision: "vision"
  in_language: "langage"
  in_speech: "parole"
  mlp_nav: "Sections de cette page"
  mlp_title: "Cette page, dessinée comme un perceptron multicouche 3&#8211;5&#8211;5&#8211;7 : la vision, le langage et la parole en entrée, sept unités de sortie, et chaque unité de sortie est une section ci-dessous. Une seule unité est active à la fois &#8212; la section à l&rsquo;écran."
  mlp_cap: "Un réseau 3&#8211;5&#8211;5&#8211;7 : la vision, le langage et la parole en entrée&#8202;; les sections de cette page en sortie. Une seule unité de sortie s&rsquo;active à la fois &#8212; la section que vous lisez &#8212; et le chemin qui l&rsquo;alimente est retracé à travers les couches cachées. Suivez une unité de sortie et la page vous y emmène."
  pc_h2: "Un neurone, trois entrées"
  pc_alt: "Un seul neurone artificiel. Trois entrées — vision, langage et parole — sont pondérées, sommées avec un biais, passées dans une fonction d&rsquo;activation, et produisent une sortie."
  pc_output: "sortie"
  pc_eqn_alt: "y égale phi de la somme pondérée plus b"
  pc_attrib: "[un neurone artificiel, Rosenblatt 1958, The Perceptron]"
  pc_gloss: "Les trois entrées sont les trois choses sur lesquelles je travaille vraiment. Les poids, c&rsquo;est là que les heures sont passées — la parole porte le plus lourd depuis deux ans. Le biais, c&rsquo;est tout le reste : l&rsquo;enseignement, les conférences, et les lectures qui n&rsquo;aboutissent jamais à un dépôt. L&rsquo;activation, c&rsquo;est ce que tout cela vaut pour quelqu&rsquo;un qui n&rsquo;est pas moi."
  at_h2: "Ce à quoi le travail prête attention"
  at_terms:
    - vision
    - parole
    - langage
    - "peu doté"
    - "moor&eacute;"
    - ASR
    - VLM
    - "données"
  at_alt: "Une carte d&rsquo;affinité de huit sur huit entre les mots vision, parole, langage, peu doté, mooré, ASR, VLM et données. La diagonale est la plus sombre. Hors diagonale, les cases les plus fortes sont parole avec mooré, parole avec ASR, parole avec peu doté, peu doté avec mooré, et vision avec VLM. La vision n&rsquo;a aucune affinité avec mooré ni avec ASR."
  at_weak: "Faible"
  at_strong: "Fort"
  at_eqn_alt: "Attention de Q, K et V égale softmax de Q K transposée divisé par la racine carrée de d indice k, le tout multiplié par V"
  at_attrib: "[attention, Vaswani et al. 2017, Attention Is All You Need]"
  at_gloss: "Huit mots portent presque tout ce sur quoi j&rsquo;ai travaillé. La grille dit ce que chacun retient des autres&#8202;: la parole tire le plus fort sur le moor&eacute;, l&rsquo;ASR et tout le problème des langues peu dotées&#8202;; la vision tire presque uniquement sur les VLM&#8202;; le langage est le seul terme qui touche tous les autres. Elle se lit symétriquement, ce qu&rsquo;une vraie carte d&rsquo;attention n&rsquo;est jamais &mdash; c&rsquo;est le portrait des idées qui reviennent ensemble, pas une matrice extraite d&rsquo;un modèle entraîné."

