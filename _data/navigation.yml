# The primary navigation, in the order it appears in the bar.
#
# `key` is what the redesign masthead turns into the link's class — nav-home,
# nav-work, nav-blog, nav-talks, nav-cv — which the design's stylesheet matches
# against <html data-view="…"> to mark the current section. `view` is the
# data-view value a page in that section sets, so the two stay in step.
# The legacy Academic Pages masthead reads title and url only and ignores both.

main:
  - title: "About"
    url: /
    key: home

  - title: "Work"
    url: /projects/
    key: work

  - title: "Writing"
    url: /blog/
    key: blog

  - title: "Teaching"
    url: /teaching-talks/
    key: talks

  - title: "CV"
    url: /cv/
    key: cv
